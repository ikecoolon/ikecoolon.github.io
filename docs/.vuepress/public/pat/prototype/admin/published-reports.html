<div id="published-reports" class="page space-y-4">
    <div class="bg-white rounded-lg border border-slate-200 p-5">
        <div class="flex flex-wrap gap-3 mb-4 items-center justify-between">
            <h2 class="text-lg font-semibold text-slate-800">已发布 / 已更正 / 已作废报告</h2>
            <div class="flex flex-wrap gap-2 items-center">
                <select id="filter-status" class="border border-slate-300 rounded-md py-1.5 px-2 text-sm">
                    <option value="">全部状态</option>
                    <option value="published">已发布</option>
                    <option value="corrected">已更正</option>
                    <option value="voided">已作废</option>
                </select>
                <input type="search" id="search-published" placeholder="搜索报告号 / 宠物名" class="border border-slate-300 rounded-md py-1.5 px-2 text-sm w-56">
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
                <thead class="bg-slate-50 text-slate-600">
                    <tr>
                        <th class="px-3 py-2 text-left">报告号</th>
                        <th class="px-3 py-2 text-left">用户 / 宠物</th>
                        <th class="px-3 py-2 text-left">状态</th>
                        <th class="px-3 py-2 text-left">发布版</th>
                        <th class="px-3 py-2 text-left">更正草稿</th>
                        <th class="px-3 py-2 text-left">最近更新</th>
                        <th class="px-3 py-2 text-left">操作</th>
                    </tr>
                </thead>
                <tbody id="published-tbody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>

    <div id="detail-drawer" class="hidden bg-white rounded-lg border border-slate-200 p-5">
        <div class="flex justify-between items-start mb-4">
            <div>
                <h3 id="detail-title" class="text-lg font-semibold"></h3>
                <p id="detail-subtitle" class="text-sm text-slate-500 mt-1"></p>
            </div>
            <button type="button" id="btn-close-detail" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
        </div>
        <div id="detail-content" class="text-sm space-y-4"></div>
        <div id="detail-actions" class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-slate-100"></div>
    </div>
</div>
