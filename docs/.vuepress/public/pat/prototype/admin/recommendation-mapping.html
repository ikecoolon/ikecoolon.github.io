<div id="recommendation-mapping" class="page space-y-4">
    <div class="bg-white rounded-lg border border-slate-200 p-5">
        <h2 class="text-lg font-semibold text-slate-800 mb-2"><i class="fas fa-link text-teal-600 mr-2"></i>推荐映射配置</h2>
        <p class="text-sm text-slate-600 mb-4">
            健康需求标签归属报告领域；每个推荐项配置<strong>一条健康建议文案</strong>、<strong>一个主推 SPU</strong>，以及<strong>若干健康标签</strong>以决定候选 SPU 映射。
            正常上架有库存时直接解析主推；零库存时保留主推专业关系并展示标签候选；下架或不存在时按标签候选；无候选时仍保留健康建议，商品承接为空。不使用商城分类作为健康语义或兜底。
        </p>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <section class="border border-slate-200 rounded-lg p-4">
                <h3 class="font-medium text-slate-700 mb-3">推荐项编辑</h3>
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="text-xs text-slate-500">选择推荐项</label>
                        <select id="edit-rec-id" class="block w-full border rounded-md py-1.5 px-2 mt-1"></select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">健康建议文案</label>
                        <textarea id="edit-label" rows="2" class="block w-full border rounded-md py-1.5 px-2 mt-1"></textarea>
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">主推 SPU（单选）</label>
                        <select id="edit-primary-product" class="block w-full border rounded-md py-1.5 px-2 mt-1"></select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">健康需求标签（多选，决定候选映射）</label>
                        <div id="edit-health-tags" class="mt-1 space-y-1"></div>
                    </div>
                    <div>
                        <label class="text-xs text-slate-500">报告物种（可选，用于候选物种过滤）</label>
                        <select id="edit-species" class="block w-full border rounded-md py-1.5 px-2 mt-1">
                            <option value="">不限</option>
                            <option value="cat">猫 (cat)</option>
                            <option value="dog">狗 (dog)</option>
                        </select>
                    </div>
                    <div class="flex gap-2 pt-1">
                        <button type="button" id="btn-save" class="btn-primary px-4 py-2 rounded-md text-sm">保存推荐项</button>
                        <button type="button" id="btn-preview" class="btn-secondary px-4 py-2 rounded-md text-sm">解析预览</button>
                    </div>
                </div>
            </section>

            <section class="border border-slate-200 rounded-lg p-4">
                <h3 class="font-medium text-slate-700 mb-3">用户端推荐预览</h3>
                <div id="resolve-result" class="text-sm space-y-2 text-slate-700">
                    <p class="text-slate-500">填写左侧表单后点击「解析预览」查看用户端展示效果。</p>
                </div>
            </section>
        </div>

        <div class="mt-6 border-t border-slate-200 pt-5">
            <div class="mb-3">
                <h3 class="font-medium text-slate-700">标签候选 SPU 映射总览</h3>
                <p class="text-xs text-slate-500 mt-1">按健康标签维护候选商品及排序；保存推荐项后，解析预览将反映最新配置。</p>
            </div>
            <div id="tag-mapping-overview" class="space-y-4"></div>
        </div>
    </div>
</div>
