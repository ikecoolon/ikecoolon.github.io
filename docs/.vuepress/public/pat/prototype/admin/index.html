<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PET 管理后台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.21.2/dist/reset.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="./css/antd-prototype.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
</head>
<body class="ant-layout-body">
    <div class="ant-admin-root">
        <aside class="ant-layout-sider md:fixed md:top-0 md:left-0 md:h-screen" id="admin-sider" aria-hidden="true">
            <div class="ant-layout-sider-brand">
                <i class="fas fa-paw"></i>
                <span>PET 管理端</span>
            </div>
            <nav class="ant-layout-sider-nav" id="main-nav">
                <p class="ant-nav-section-title">检测与报告</p>
                <a class="ant-nav-item nav-item" href="#detection-records" data-page="detection-records"><i class="fas fa-vial"></i>送检管理</a>
                <a class="ant-nav-item nav-item" href="#report-center" data-page="report-center"><i class="fas fa-table-list"></i>报告中心</a>

                <p class="ant-nav-section-title">专业配置</p>
                <a class="ant-nav-item nav-item" href="#normal-range-config" data-page="normal-range-config"><i class="fas fa-sliders"></i>指标/参考范围</a>
                <a class="ant-nav-item nav-item" href="#microbiota-knowledge" data-page="microbiota-knowledge"><i class="fas fa-book-open"></i>菌群科普</a>
                <a class="ant-nav-item nav-item" href="#analysis-rules" data-page="analysis-rules"><i class="fas fa-brain"></i>分析规则</a>

                <p class="ant-nav-section-title">用户与宠物</p>
                <a class="ant-nav-item nav-item" href="#customer-management" data-page="customer-management"><i class="fas fa-users"></i>客户管理</a>
                <a class="ant-nav-item nav-item" href="#pet-information" data-page="pet-information"><i class="fas fa-dog"></i>宠物档案</a>
                <a class="ant-nav-item nav-item" href="#dictionary-management" data-page="dictionary-management"><i class="fas fa-book"></i>字典管理</a>
            </nav>
            <div class="ant-layout-sider-footer">
                &copy; 2025 ikecoolon
            </div>
        </aside>

        <div id="sider-mask" class="ant-sider-mask" aria-hidden="true"></div>

        <div class="ant-layout-main md:ml-[220px]">
            <header class="ant-layout-header">
                <div class="flex items-center gap-3 min-w-0">
                    <button type="button" class="ant-sider-toggle" id="sider-toggle" aria-label="切换导航" aria-expanded="false" aria-controls="admin-sider">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 id="page-title" class="ant-layout-header-title truncate"></h1>
                </div>
                <span class="ant-layout-header-extra">管理员</span>
            </header>

            <main class="ant-layout-content">
                <div id="page-content-container"></div>
            </main>
        </div>
    </div>

    <div id="toast-container" aria-live="polite"></div>

    <script src="../shared/analysis-engine.js"></script>
    <script src="../shared/mock-store.js"></script>
    <script src="./js/admin-common.js"></script>
    <script src="./js/dictionary-data-service.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
