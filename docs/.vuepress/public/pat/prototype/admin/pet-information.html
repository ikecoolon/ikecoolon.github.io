<div id="pet-information" class="page p-4">

    <div id="main-view" class="bg-white p-6 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-semibold">宠物档案管理</h3>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-4">
            <div class="flex-1">
                <label for="search-pet" class="sr-only">搜索宠物</label>
                <input type="text" id="search-pet" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="搜索宠物姓名、品种、关联用户">
            </div>
            <div class="flex flex-wrap gap-2">
                <select id="filter-breed" class="shadow border rounded py-2 px-3 text-gray-700 focus:outline-none focus:shadow-outline" aria-label="品种筛选">
                    <option value="">全部品种</option>
                </select>
                <select id="filter-gender" class="shadow border rounded py-2 px-3 text-gray-700 focus:outline-none focus:shadow-outline" aria-label="性别筛选">
                    <option value="">全部性别</option>
                    <option value="male">公</option>
                    <option value="female">母</option>
                    <option value="unknown">未知</option>
                </select>
                <select id="filter-age-range" class="shadow border rounded py-2 px-3 text-gray-700 focus:outline-none focus:shadow-outline" aria-label="年龄筛选">
                    <option value="">全部年龄</option>
                    <option value="0-1">0-1岁</option>
                    <option value="1-3">1-3岁</option>
                    <option value="3-7">3-7岁</option>
                    <option value="7+">7岁以上</option>
                </select>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border border-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">宠物</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">物种/品种</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">年龄/性别</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">当前关联用户</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">已发布报告</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">最近检测</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                    </tr>
                </thead>
                <tbody id="pet-table-body" class="bg-white divide-y divide-gray-200">
                    <tr>
                        <td colspan="7" class="px-4 py-4 text-center text-gray-500">暂无宠物信息</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 编辑最小资料 -->
    <div id="form-view" class="bg-white p-6 rounded-lg shadow-md hidden">
        <div class="flex justify-between items-center mb-4">
            <h3 id="form-title" class="text-xl font-semibold">编辑宠物资料</h3>
            <button type="button" id="back-to-list" class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600">
                <i class="fas fa-arrow-left mr-2"></i>返回列表
            </button>
        </div>

        <form id="pet-form" class="space-y-4 max-w-2xl">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="form-pet-name">宠物名称 <span class="text-red-500">*</span></label>
                <input type="text" id="form-pet-name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="form-pet-species">物种 <span class="text-red-500">*</span></label>
                    <select id="form-pet-species" class="shadow border rounded w-full py-2 px-3 text-gray-700" required>
                        <option value="dog">犬</option>
                        <option value="cat">猫</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="form-pet-breed">品种 <span class="text-red-500">*</span></label>
                    <input type="text" id="form-pet-breed" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" required>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="form-gender">性别</label>
                    <select id="form-gender" class="shadow border rounded w-full py-2 px-3 text-gray-700">
                        <option value="unknown">未知</option>
                        <option value="male">公</option>
                        <option value="female">母</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="form-birth-date">出生日期（可选）</label>
                    <input type="date" id="form-birth-date" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
                </div>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">保存</button>
                <button type="button" id="cancel-form" class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600">取消</button>
            </div>
        </form>
    </div>

    <!-- 宠物详情 -->
    <div id="detail-view" class="bg-white p-6 rounded-lg shadow-md hidden">
        <div class="flex justify-between items-center mb-4">
            <h3 id="detail-title" class="text-xl font-semibold">宠物详情</h3>
            <button type="button" id="back-from-detail" class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600">
                <i class="fas fa-arrow-left mr-2"></i>返回列表
            </button>
        </div>

        <div id="detail-pet-summary" class="border border-gray-200 rounded-lg p-4 mb-6 text-sm"></div>

        <div class="mb-6">
            <div class="flex justify-between items-center mb-3">
                <h4 class="text-lg font-medium text-gray-800">当前关联用户</h4>
                <button type="button" id="change-user-btn" class="px-3 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600">变更关联</button>
            </div>
            <div id="detail-user-info" class="text-sm text-gray-700"></div>
        </div>

        <div class="mb-6">
            <h4 class="text-lg font-medium text-gray-800 mb-3">已发布历史报告</h4>
            <div id="detail-reports-list" class="border border-gray-200 rounded-lg overflow-hidden"></div>
        </div>

        <div>
            <h4 class="text-lg font-medium text-gray-800 mb-3">用户关联变更记录</h4>
            <div id="detail-user-history" class="text-sm text-gray-600 space-y-2"></div>
        </div>
    </div>

    <!-- 报告归档模态框 -->
    <div id="assign-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-lg w-full mx-4 max-h-[90vh] overflow-y-auto">
            <h4 class="text-lg font-medium mb-4">报告归档</h4>
            <input type="hidden" id="assign-test-record-id">
            <div class="space-y-4 text-sm">
                <div>
                    <label class="block font-medium mb-1" for="assign-mode">归档方式</label>
                    <select id="assign-mode" class="w-full border rounded px-3 py-2">
                        <option value="existing">归入已有宠物</option>
                        <option value="new">新建宠物并归档</option>
                    </select>
                </div>
                <div id="assign-existing-pet-fields">
                    <label class="block mb-1" for="assign-existing-pet">搜索并选择宠物</label>
                    <input type="text" id="assign-pet-search" class="w-full border rounded px-3 py-2 mb-2" placeholder="输入宠物名称或品种">
                    <select id="assign-existing-pet" class="w-full border rounded px-3 py-2"></select>
                </div>
                <div id="assign-new-pet-fields" class="hidden">
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block mb-1" for="assign-pet-name">宠物名称</label><input type="text" id="assign-pet-name" class="w-full border rounded px-3 py-2"></div>
                        <div><label class="block mb-1" for="assign-pet-breed">品种</label><input type="text" id="assign-pet-breed" class="w-full border rounded px-3 py-2"></div>
                        <div><label class="block mb-1" for="assign-pet-species">物种</label><select id="assign-pet-species" class="w-full border rounded px-3 py-2"><option value="dog">犬</option><option value="cat">猫</option></select></div>
                        <div><label class="block mb-1" for="assign-pet-gender">性别</label><select id="assign-pet-gender" class="w-full border rounded px-3 py-2"><option value="unknown">未知</option><option value="male">公</option><option value="female">母</option></select></div>
                    </div>
                </div>
                <div>
                    <label class="block font-medium mb-1" for="assign-user-search">关联平台用户（可选）</label>
                    <input type="text" id="assign-user-search" class="w-full border rounded px-3 py-2 mb-2" placeholder="输入手机号或姓名搜索">
                    <select id="assign-user-id" class="w-full border rounded px-3 py-2">
                        <option value="">暂不关联用户</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button type="button" id="assign-cancel" class="px-4 py-2 bg-gray-500 text-white rounded">取消</button>
                <button type="button" id="assign-submit" class="px-4 py-2 bg-teal-600 text-white rounded">确认归档</button>
            </div>
        </div>
    </div>

    <!-- 变更关联用户 -->
    <div id="change-user-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-lg w-full mx-4">
            <h4 class="text-lg font-medium mb-4">变更关联用户</h4>
            <input type="hidden" id="change-user-pet-id">
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block mb-1" for="change-user-search">平台用户</label>
                    <input type="text" id="change-user-search" class="w-full border rounded px-3 py-2 mb-2" placeholder="输入手机号或姓名">
                    <select id="change-user-id" class="w-full border rounded px-3 py-2">
                        <option value="">解除关联（无用户）</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1" for="change-user-reason">变更原因 <span class="text-red-500">*</span></label>
                    <textarea id="change-user-reason" class="w-full border rounded px-3 py-2" rows="3" placeholder="请填写变更原因"></textarea>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button type="button" id="change-user-cancel" class="px-4 py-2 bg-gray-500 text-white rounded">取消</button>
                <button type="button" id="change-user-submit" class="px-4 py-2 bg-blue-600 text-white rounded">确认变更</button>
            </div>
        </div>
    </div>
</div>

<script src="./js/dictionary-data-service.js"></script>
