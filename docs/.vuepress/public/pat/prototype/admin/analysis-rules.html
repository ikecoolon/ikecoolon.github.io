<div id="analysis-rules" class="page p-4 space-y-4">
  <div class="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2 text-sm text-amber-900">
    <i class="fas fa-flask mr-2"></i>本页为 <strong>[演示 Mock]</strong> 分析规则与报告分析工作台，数据来自共享 Mock Store。
  </div>

  <!-- 业务区切换 -->
  <div class="flex border-b border-gray-200 bg-white rounded-t-lg px-4 pt-2">
    <button type="button" id="tab-rules" class="ar-tab px-4 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600">
      <i class="fas fa-sliders-h mr-1"></i>规则版本管理
    </button>
    <button type="button" id="tab-workbench" class="ar-tab px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-600 hover:text-gray-900">
      <i class="fas fa-microscope mr-1"></i>报告分析工作台
    </button>
  </div>

  <!-- ========== 规则版本管理 ========== -->
  <div id="section-rules" class="bg-white p-6 rounded-b-lg shadow-md">
    <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
      <h3 class="text-xl font-semibold">规则版本管理</h3>
      <button type="button" id="add-new-rule" class="px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 text-sm">
        <i class="fas fa-plus mr-1"></i>新增草稿规则
      </button>
    </div>

    <div id="rules-list-view">
      <div class="flex flex-col md:flex-row gap-3 mb-4">
        <input type="text" id="search-rule" class="flex-1 shadow border rounded py-2 px-3 text-sm" placeholder="搜索规则名称、条件、输出内容…">
        <select id="filter-status" class="shadow border rounded py-2 px-3 text-sm">
          <option value="">全部状态</option>
          <option value="active">启用中</option>
          <option value="draft">草稿</option>
          <option value="inactive">已停用</option>
        </select>
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full border border-gray-200 text-sm">
          <thead class="bg-gray-50 text-xs uppercase text-gray-500">
            <tr>
              <th class="px-3 py-2 text-left">规则 / 版本</th>
              <th class="px-3 py-2 text-left">条件 (ALL/ANY)</th>
              <th class="px-3 py-2 text-left">风险 / 优先级 / 冲突组</th>
              <th class="px-3 py-2 text-left">输出</th>
              <th class="px-3 py-2 text-left">状态</th>
              <th class="px-3 py-2 text-left">操作</th>
            </tr>
          </thead>
          <tbody id="rules-table-body" class="divide-y divide-gray-100">
            <tr><td colspan="6" class="px-4 py-6 text-center text-gray-500">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="rules-form-view" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <h3 id="form-title" class="text-lg font-semibold">新增草稿规则</h3>
        <button type="button" id="back-to-rules-list" class="px-3 py-1.5 bg-gray-500 text-white rounded text-sm hover:bg-gray-600">
          <i class="fas fa-arrow-left mr-1"></i>返回列表
        </button>
      </div>
      <form id="rule-form" class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1" for="form-rule-name">规则名称 <span class="text-red-500">*</span></label>
            <input type="text" id="form-rule-name" class="w-full border rounded py-2 px-3 text-sm" required>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1" for="form-conflict-group">冲突组</label>
            <input type="text" id="form-conflict-group" class="w-full border rounded py-2 px-3 text-sm" placeholder="如 gut_balance">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" for="form-rule-description">描述</label>
          <textarea id="form-rule-description" class="w-full border rounded py-2 px-3 text-sm" rows="2"></textarea>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div>
            <label class="block text-xs font-medium mb-1" for="form-risk-level">风险等级</label>
            <select id="form-risk-level" class="w-full border rounded py-2 px-2 text-sm">
              <option value="low">低</option>
              <option value="medium" selected>中</option>
              <option value="high">高</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="form-priority">优先级</label>
            <input type="number" id="form-priority" class="w-full border rounded py-2 px-2 text-sm" value="10" min="1">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="logic-operator">条件组合</label>
            <select id="logic-operator" class="w-full border rounded py-2 px-2 text-sm">
              <option value="ALL">全部满足 (ALL)</option>
              <option value="ANY">任一满足 (ANY)</option>
            </select>
          </div>
          <div class="flex items-end">
            <label class="flex items-center text-sm">
              <input type="checkbox" id="form-data-integrity-only" class="mr-2">
              仅数据完整性提示
            </label>
          </div>
        </div>

        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
          <div class="flex justify-between items-center mb-3">
            <h4 class="font-medium text-sm">触发条件 <span class="text-gray-500 font-normal">（无脚本/表达式入口）</span></h4>
            <button type="button" id="add-condition-btn" class="text-xs px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">
              <i class="fas fa-plus mr-1"></i>添加条件
            </button>
          </div>
          <div id="conditions-container" class="space-y-2"></div>
          <div id="no-conditions" class="text-center py-6 text-gray-500 text-sm">
            尚未配置条件，点击「添加条件」开始
          </div>
        </div>

        <div class="bg-green-50 border border-green-200 rounded-lg p-4 space-y-3">
          <h4 class="font-medium text-sm">输出内容</h4>
          <div>
            <label class="block text-xs font-medium mb-1" for="form-professional">专业结论</label>
            <textarea id="form-professional" class="w-full border rounded py-2 px-3 text-sm" rows="2"></textarea>
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="form-consumer">通俗解释</label>
            <textarea id="form-consumer" class="w-full border rounded py-2 px-3 text-sm" rows="2"></textarea>
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="form-health-advice">健康建议</label>
            <textarea id="form-health-advice" class="w-full border rounded py-2 px-3 text-sm" rows="2"></textarea>
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="form-output-mode">输出模式</label>
            <select id="form-output-mode" class="w-full border rounded py-2 px-2 text-sm">
              <option value="both">专业 + 通俗 + 建议</option>
              <option value="analysis">仅分析（专业/通俗）</option>
              <option value="advice">仅建议</option>
            </select>
          </div>
        </div>

        <div class="flex gap-3">
          <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded text-sm hover:bg-blue-600">
            <i class="fas fa-save mr-1"></i>保存草稿
          </button>
          <button type="button" id="cancel-form" class="px-4 py-2 bg-gray-400 text-white rounded text-sm hover:bg-gray-500">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== 报告分析工作台 ========== -->
  <div id="section-workbench" class="bg-white p-6 rounded-b-lg shadow-md hidden">
    <h3 class="text-xl font-semibold mb-4">报告分析工作台</h3>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
      <div class="lg:col-span-1 space-y-3">
        <label class="block text-sm font-medium" for="wb-report-select">选择报告</label>
        <select id="wb-report-select" class="w-full border rounded py-2 px-3 text-sm"></select>
        <div id="wb-report-meta" class="text-sm bg-gray-50 border rounded p-3 space-y-1"></div>
        <div id="wb-reanalysis-banner" class="hidden bg-amber-50 border border-amber-300 rounded p-3 text-sm text-amber-900">
          <i class="fas fa-exclamation-triangle mr-1"></i>
          <span id="wb-reanalysis-text">指标或启用规则已变化，待重新分析</span>
          <button type="button" id="wb-run-analysis" class="mt-2 w-full px-3 py-2 bg-amber-600 text-white rounded text-sm hover:bg-amber-700">
            <i class="fas fa-play mr-1"></i>重新分析（Mock）
          </button>
        </div>
        <button type="button" id="wb-run-first" class="w-full px-3 py-2 bg-blue-500 text-white rounded text-sm hover:bg-blue-600">
          <i class="fas fa-play mr-1"></i>运行分析（Mock）
        </button>
      </div>
      <div class="lg:col-span-2">
        <h4 class="text-sm font-medium mb-2">有效结果摘要</h4>
        <div id="wb-indicators-summary" class="border rounded overflow-x-auto text-xs max-h-48 overflow-y-auto"></div>
      </div>
    </div>

    <div id="wb-run-history" class="mb-4 hidden">
      <label class="block text-sm font-medium mb-1" for="wb-run-select">历史运行</label>
      <select id="wb-run-select" class="border rounded py-1.5 px-2 text-sm max-w-md"></select>
      <span id="wb-run-meta" class="ml-2 text-xs text-gray-500"></span>
    </div>

    <div id="wb-no-run" class="text-center py-10 text-gray-500 text-sm border border-dashed rounded-lg">
      选择报告后点击「运行分析」查看原始命中、组合结果与人工调整
    </div>

    <div id="wb-results" class="hidden space-y-6">
      <!-- 原始命中 -->
      <div>
        <h4 class="text-sm font-semibold mb-2 flex items-center">
          <i class="fas fa-bullseye mr-2 text-blue-600"></i>原始命中
          <span class="ml-2 text-xs font-normal text-gray-500">（不可覆盖，仅可排除/恢复）</span>
        </h4>
        <div id="wb-raw-hits" class="space-y-2"></div>
      </div>

      <!-- 组合结果 -->
      <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-4">
        <h4 class="text-sm font-semibold mb-2 text-indigo-900">
          <i class="fas fa-layer-group mr-1"></i>组合结果（Mock 自动合并）
        </h4>
        <div id="wb-combined-result" class="text-sm space-y-2"></div>
      </div>

      <!-- 人工最终内容 -->
      <div class="bg-teal-50 border border-teal-200 rounded-lg p-4">
        <h4 class="text-sm font-semibold mb-3 text-teal-900">
          <i class="fas fa-user-edit mr-1"></i>人工最终内容
        </h4>
        <div id="wb-manual-findings" class="mb-4 space-y-2"></div>
        <button type="button" id="wb-add-manual-finding" class="text-xs px-3 py-1 bg-teal-600 text-white rounded hover:bg-teal-700 mb-4">
          <i class="fas fa-plus mr-1"></i>补充人工发现
        </button>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-medium mb-1" for="wb-final-professional">专业结论（微调）</label>
            <textarea id="wb-final-professional" class="w-full border rounded py-2 px-3 text-sm" rows="2"></textarea>
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="wb-final-consumer">通俗解释（微调）</label>
            <textarea id="wb-final-consumer" class="w-full border rounded py-2 px-3 text-sm" rows="2"></textarea>
          </div>
          <div>
            <label class="block text-xs font-medium mb-1" for="wb-final-advice">健康建议（微调）</label>
            <textarea id="wb-final-health-advice" class="w-full border rounded py-2 px-3 text-sm" rows="2"></textarea>
          </div>
          <button type="button" id="wb-save-final" class="px-4 py-2 bg-teal-600 text-white rounded text-sm hover:bg-teal-700">
            <i class="fas fa-save mr-1"></i>保存人工调整
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 条件行模板 -->
  <template id="condition-template">
    <div class="condition-item border border-gray-200 rounded bg-white p-3">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-medium text-gray-600">条件 <span class="condition-number">1</span></span>
        <button type="button" class="remove-condition text-red-500 hover:text-red-700 text-xs"><i class="fas fa-trash"></i></button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
        <div>
          <label class="block text-xs text-gray-500 mb-0.5">类型</label>
          <select class="condition-type w-full border rounded px-2 py-1 text-xs">
            <option value="NUMERIC_COMPARE">数值比较</option>
            <option value="DATA_STATUS">数据状态</option>
            <option value="SPECIES">报告物种</option>
          </select>
        </div>
        <div class="condition-field-indicator">
          <label class="block text-xs text-gray-500 mb-0.5">检测指标</label>
          <input type="text" class="condition-indicator w-full border rounded px-2 py-1 text-xs" placeholder="如：放线菌门">
        </div>
        <div class="condition-field-operator hidden">
          <label class="block text-xs text-gray-500 mb-0.5">比较符</label>
          <select class="condition-operator w-full border rounded px-2 py-1 text-xs">
            <option value=">">&gt;</option>
            <option value=">=">&gt;=</option>
            <option value="<">&lt;</option>
            <option value="<=">&lt;=</option>
            <option value="=">=</option>
            <option value="!=">≠</option>
          </select>
        </div>
        <div class="condition-field-value hidden">
          <label class="block text-xs text-gray-500 mb-0.5">阈值</label>
          <input type="number" class="condition-value w-full border rounded px-2 py-1 text-xs" step="0.01">
        </div>
        <div class="condition-field-unit hidden">
          <label class="block text-xs text-gray-500 mb-0.5">单位</label>
          <input type="text" class="condition-unit w-full border rounded px-2 py-1 text-xs" value="%">
        </div>
        <div class="condition-field-status hidden">
          <label class="block text-xs text-gray-500 mb-0.5">数据状态</label>
          <select class="condition-data-status w-full border rounded px-2 py-1 text-xs">
            <option value="PRESENT">PRESENT（有效）</option>
            <option value="NOT_DETECTED">NOT_DETECTED（未检出）</option>
            <option value="MISSING_COLUMN">MISSING_COLUMN（缺列）</option>
            <option value="EMPTY">EMPTY（空值）</option>
            <option value="INVALID">INVALID（无效）</option>
            <option value="NOT_APPLICABLE">NOT_APPLICABLE（不适用）</option>
          </select>
        </div>
        <div class="condition-field-species hidden md:col-span-2">
          <label class="block text-xs text-gray-500 mb-0.5">物种（逗号分隔）</label>
          <input type="text" class="condition-species w-full border rounded px-2 py-1 text-xs" placeholder="猫,狗 或 cat,dog">
        </div>
      </div>
    </div>
  </template>
</div>
