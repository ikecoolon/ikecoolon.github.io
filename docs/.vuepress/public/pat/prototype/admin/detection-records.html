<div id="detection-records" class="page">
    <div class="bg-white rounded-lg border border-slate-200 p-5">
        <div class="flex flex-wrap gap-3 mb-4 items-end justify-between">
            <div class="flex flex-wrap gap-2 items-center">
                <label class="text-sm text-slate-600">状态筛选</label>
                <select id="filter-status" class="border border-slate-300 rounded-md py-1.5 px-2 text-sm">
                    <option value="">全部</option>
                    <option value="pending_result">待结果</option>
                    <option value="pending_claim">待认领</option>
                    <option value="import_failed">导入异常</option>
                    <option value="pending_review">待审核</option>
                    <option value="published">已发布</option>
                </select>
                <input type="search" id="search-records" placeholder="搜索 ID / 标签" class="border border-slate-300 rounded-md py-1.5 px-2 text-sm w-48">
            </div>
            <div class="flex gap-2">
                <button type="button" id="btn-register-test" class="btn-secondary px-3 py-2 rounded-md text-sm"><i class="fas fa-plus mr-1"></i>登记检测</button>
                <button type="button" id="btn-go-import" class="btn-primary px-3 py-2 rounded-md text-sm"><i class="fas fa-file-excel mr-1"></i>Excel 导入</button>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
                <thead class="bg-slate-50 text-slate-600">
                    <tr>
                        <th class="px-3 py-2 text-left font-medium">检测 ID</th>
                        <th class="px-3 py-2 text-left font-medium">用户</th>
                        <th class="px-3 py-2 text-left font-medium">宠物</th>
                        <th class="px-3 py-2 text-left font-medium">机构</th>
                        <th class="px-3 py-2 text-left font-medium">样本</th>
                        <th class="px-3 py-2 text-left font-medium">检测日</th>
                        <th class="px-3 py-2 text-left font-medium">绑定来源</th>
                        <th class="px-3 py-2 text-left font-medium">状态</th>
                        <th class="px-3 py-2 text-left font-medium">操作</th>
                    </tr>
                </thead>
                <tbody id="records-tbody" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
        <p id="records-empty" class="hidden text-center text-slate-500 py-8">无匹配记录</p>
    </div>
</div>
