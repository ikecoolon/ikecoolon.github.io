<div id="report-review" class="page space-y-4">
    <div class="bg-white rounded-lg border border-slate-200 p-4 flex flex-wrap gap-3 items-center justify-between">
        <div class="flex flex-wrap gap-3 items-center">
            <label class="text-sm text-slate-600">审核队列</label>
            <select id="select-report" class="border border-slate-300 rounded-md py-1.5 px-2 text-sm min-w-[240px]"></select>
            <span id="report-status-badge"></span>
            <span id="version-badges" class="text-xs text-slate-500"></span>
        </div>
        <div class="flex flex-wrap gap-2" id="action-bar"></div>
    </div>

    <div id="correction-banner" class="hidden bg-indigo-50 border border-indigo-200 text-indigo-900 px-4 py-2 rounded-md text-sm">
        <i class="fas fa-pen-ruler mr-1"></i>更正草稿审核中：用户仍读取已发布版本 v<span id="correction-pub-ver"></span>，工作版本独立编辑。
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-12 gap-4">
        <section class="xl:col-span-4 space-y-4">
            <div class="bg-white rounded-lg border border-slate-200 p-4">
                <h3 class="font-semibold text-slate-800 mb-3 text-sm"><i class="fas fa-link text-teal-600 mr-1"></i>报告来源 / 归属</h3>
                <div id="source-panel" class="text-sm space-y-2"></div>
            </div>
            <div class="bg-white rounded-lg border border-slate-200 p-4">
                <h3 class="font-semibold text-slate-800 mb-3 text-sm"><i class="fas fa-sliders text-teal-600 mr-1"></i>人工综合评定</h3>
                <p class="text-xs text-slate-500 mb-3">等级、综合分、百分位、平台维度互相独立，不做自动推导。</p>
                <form id="assessment-form" class="space-y-3 text-sm"></form>
                <button type="button" id="btn-save-assessment" class="mt-3 btn-secondary w-full py-2 rounded-md text-sm">
                    <i class="fas fa-save mr-1"></i>保存评定
                </button>
            </div>
        </section>

        <section class="xl:col-span-4 space-y-4">
            <div class="bg-white rounded-lg border border-slate-200 p-4">
                <h3 class="font-semibold text-slate-800 mb-3 text-sm"><i class="fas fa-vial text-teal-600 mr-1"></i>有效检测结果</h3>
                <div id="indicators-panel" class="space-y-2 text-sm max-h-[280px] overflow-y-auto"></div>
            </div>
            <div class="bg-white rounded-lg border border-slate-200 p-4">
                <h3 class="font-semibold text-slate-800 mb-3 text-sm"><i class="fas fa-microscope text-teal-600 mr-1"></i>规则分析（最新运行）</h3>
                <div id="analysis-panel" class="text-sm space-y-3"></div>
                <button type="button" id="btn-save-analysis" class="mt-3 btn-secondary w-full py-2 rounded-md text-sm hidden">
                    <i class="fas fa-save mr-1"></i>保存最终解释
                </button>
            </div>
        </section>

        <section class="xl:col-span-4 space-y-4">
            <div class="bg-white rounded-lg border border-slate-200 p-4">
                <h3 class="font-semibold text-slate-800 mb-3 text-sm"><i class="fas fa-lightbulb text-teal-600 mr-1"></i>推荐映射</h3>
                <div id="recommendations-panel" class="text-sm space-y-2 max-h-[200px] overflow-y-auto"></div>
            </div>
            <div class="bg-white rounded-lg border border-slate-200 p-4">
                <h3 class="font-semibold text-slate-800 mb-3 text-sm"><i class="fas fa-clipboard-check text-teal-600 mr-1"></i>发布检查</h3>
                <p class="text-xs text-amber-700 mb-2">正式发布条件：综合概览（摘要+等级+分数）、专业检测结果（至少一项有效结果）</p>
                <div id="checks-panel" class="text-sm space-y-2"></div>
            </div>
        </section>
    </div>
</div>
