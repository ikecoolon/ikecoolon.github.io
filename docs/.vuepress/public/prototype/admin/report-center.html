<link rel="stylesheet" href="./css/report-center.css">
<div id="report-center" class="page rondo-list-page">
    <div class="rondo-search-card">
        <div class="rondo-view-tabs ant-tabs-nav" id="rc-view-tabs" role="tablist" aria-label="报告状态视图">
            <button type="button" class="rc-view-tab ant-tabs-tab" data-view="pending" aria-selected="true">待处理 <span class="rc-tab-count" data-count-for="pending"></span></button>
            <button type="button" class="rc-view-tab ant-tabs-tab" data-view="all">全部 <span class="rc-tab-count" data-count-for="all"></span></button>
            <button type="button" class="rc-view-tab ant-tabs-tab" data-view="incomplete">待完善 <span class="rc-tab-count" data-count-for="incomplete"></span></button>
            <button type="button" class="rc-view-tab ant-tabs-tab" data-view="pending_review">待审核 <span class="rc-tab-count" data-count-for="pending_review"></span></button>
            <button type="button" class="rc-view-tab ant-tabs-tab" data-view="published">已发布 <span class="rc-tab-count" data-count-for="published"></span></button>
            <button type="button" class="rc-view-tab ant-tabs-tab" data-view="voided">已作废 <span class="rc-tab-count" data-count-for="voided"></span></button>
        </div>
        <div id="rc-list-table"></div>
    </div>
</div>
