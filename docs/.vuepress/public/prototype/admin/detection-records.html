<div id="detection-records" class="page rondo-list-page" data-page-css="./css/identity-pages.css?v=20260907">
    <div id="btn-go-report-center-wrap" class="rondo-back-bar hidden">
        <button type="button" id="btn-go-report-center" class="ant-btn ant-btn-default ant-btn-sm">
            <i class="fas fa-arrow-left"></i>返回报告中心
        </button>
    </div>

    <div id="dr-linked-context" class="rondo-banner rondo-banner-info hidden">
        <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
                <p class="font-medium">当前仅显示该报告唯一关联的送检记录</p>
                <p id="dr-linked-detail" class="rondo-form-hint"></p>
            </div>
            <button type="button" id="dr-view-all" class="ant-btn ant-btn-default ant-btn-sm">查看全部送检记录</button>
        </div>
    </div>

    <div id="dr-not-found" class="rondo-banner rondo-banner-warning hidden">
        <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
                <p class="font-medium">未找到关联的送检记录</p>
                <p id="dr-not-found-detail" class="rondo-form-hint"></p>
            </div>
            <button type="button" id="dr-view-all-not-found" class="ant-btn ant-btn-default ant-btn-sm">查看全部送检记录</button>
        </div>
    </div>

    <div id="dr-filter-bar">
        <div class="rondo-view-tabs" id="dr-view-tabs" role="tablist" aria-label="送检阶段视图">
            <button type="button" class="dr-view-tab" data-view="pending_result" aria-selected="true">待导入结果 <span class="dr-tab-count" data-count-for="pending_result"></span></button>
            <button type="button" class="dr-view-tab" data-view="import_failed">导入异常 <span class="dr-tab-count" data-count-for="import_failed"></span></button>
            <button type="button" class="dr-view-tab" data-view="all">全部送检 <span class="dr-tab-count" data-count-for="all"></span></button>
        </div>
    </div>

    <div id="dr-list-table"></div>
</div>
