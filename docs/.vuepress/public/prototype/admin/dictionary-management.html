<link rel="stylesheet" href="./css/dictionary-management.css">
<div id="dictionary-management" class="page rondo-page">
    <div id="dm-list-view">
        <div class="rondo-page-header">
            <div>
                <h2 class="rondo-page-title">专业基础资料</h2>
                <p class="rondo-page-desc">品种字典、普通检测指标与菌群分类树统一维护，供参考范围与报告完善读取</p>
            </div>
            <div class="rondo-toolbar-actions" id="catalog-list-actions">
                <button type="button" id="batch-sort-toggle" class="rondo-btn rondo-btn-default">
                    <i class="fas fa-sort"></i> 批量排序
                </button>
                <button type="button" id="add-new-key" class="rondo-btn rondo-btn-primary">
                    <i class="fas fa-plus"></i> 新增
                </button>
            </div>
        </div>

        <div id="batch-sort-toolbar" class="hidden rondo-callout rondo-callout-info catalog-sort-toolbar">
            <span class="rondo-callout-text">批量排序：仅可调整同级顺序，拖动行或使用上下按钮</span>
            <div class="rondo-toolbar-actions">
                <button type="button" id="batch-sort-renumber" class="rondo-btn rondo-btn-default rondo-btn-sm">
                    <i class="fas fa-list-ol"></i> 按当前顺序重新编号
                </button>
                <button type="button" id="batch-sort-save" class="rondo-btn rondo-btn-primary rondo-btn-sm">
                    <i class="fas fa-save"></i> 保存排序
                </button>
                <button type="button" id="batch-sort-cancel" class="rondo-btn rondo-btn-default rondo-btn-sm">取消</button>
            </div>
        </div>

        <div class="rondo-segmented" id="catalog-tabs" role="tablist" aria-label="资料分类">
            <button type="button" class="rondo-segmented-btn catalog-tab is-active" data-tab="breeds" role="tab" aria-selected="true">品种字典</button>
            <button type="button" class="rondo-segmented-btn catalog-tab" data-tab="indicators" role="tab" aria-selected="false">普通检测指标</button>
            <button type="button" class="rondo-segmented-btn catalog-tab" data-tab="microbiota" role="tab" aria-selected="false">菌群分类树</button>
        </div>

        <div id="dm-sort-mount" class="hidden"></div>
        <div id="dm-list-mount"></div>
    </div>
</div>
