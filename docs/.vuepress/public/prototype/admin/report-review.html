<div id="report-review" class="page rw-page">
    <div class="rw-topbar ant-card ant-card-bordered">
        <div class="rw-topbar-main">
            <button type="button" id="btn-go-report-center" class="ant-btn ant-btn-default ant-btn-sm rw-topbar-back">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>返回报告中心
            </button>
            <label class="rw-topbar-label" for="select-report">报告</label>
            <select id="select-report" class="ant-select rw-report-select" aria-label="选择报告"></select>
            <span id="report-status-badge" class="rw-status-badge"></span>
            <span id="version-badges" class="rw-version-badges"></span>
            <span id="rw-dirty-indicator" class="rw-dirty-indicator hidden" role="status">有未保存修改</span>
        </div>
        <div class="rw-topbar-actions" id="action-bar"></div>
    </div>

    <div id="reject-banner" class="rw-banner rw-banner-warning hidden" role="status">
        <i class="fas fa-undo" aria-hidden="true"></i>退回原因：<span id="reject-reason-text"></span>
    </div>

    <div id="correction-banner" class="rw-banner rw-banner-info hidden" role="status">
        <i class="fas fa-pen-ruler" aria-hidden="true"></i>更正草稿进行中：用户仍读取已发布版本 v<span id="correction-pub-ver"></span>，工作版本独立编辑。
    </div>

    <div id="rw-workbench" class="rw-workbench">
        <nav id="rw-module-nav" class="rw-module-nav" aria-label="报告模块导航"></nav>

        <div class="rw-center">
            <div id="rw-module-panels" class="rw-module-panels">
                <section id="module-source" class="rw-module-panel hidden" data-module="source">
                    <h3 class="rw-panel-title"><i class="fas fa-link rw-panel-icon" aria-hidden="true"></i>来源与归属</h3>
                    <div id="source-panel" class="rw-panel-body"></div>
                </section>

                <section id="module-results" class="rw-module-panel hidden" data-module="results">
                    <h3 class="rw-panel-title"><i class="fas fa-vial rw-panel-icon" aria-hidden="true"></i>检测结果</h3>
                    <div class="rw-results-toolbar">
                        <input type="search" id="results-search" class="ant-input rw-results-search" placeholder="搜索名称…" aria-label="搜索结果">
                        <div class="rw-results-filters" id="results-filters" role="group" aria-label="结果筛选">
                            <button type="button" class="rw-filter-btn ant-btn ant-btn-sm" data-filter="abnormal">异常</button>
                            <button type="button" class="rw-filter-btn ant-btn ant-btn-sm" data-filter="missing">缺失</button>
                            <button type="button" class="rw-filter-btn ant-btn ant-btn-sm" data-filter="modified">已修改</button>
                        </div>
                        <button type="button" id="btn-supplement-result" class="ant-btn ant-btn-default ant-btn-sm">
                            <i class="fas fa-plus" aria-hidden="true"></i>补录
                        </button>
                    </div>
                    <div class="rw-results-layout">
                        <div id="indicators-list" class="rw-indicators-list"></div>
                        <div id="indicator-detail" class="rw-indicator-detail"></div>
                    </div>
                </section>

                <section id="module-assessment" class="rw-module-panel hidden" data-module="assessment">
                    <h3 class="rw-panel-title"><i class="fas fa-sliders rw-panel-icon" aria-hidden="true"></i>综合评定</h3>
                    <p class="rw-panel-hint">物种、等级、综合分、百分位、情绪、免疫互相独立，不做自动推导。备注为可选项，不阻断发布。</p>
                    <form id="assessment-form" class="rw-assessment-form"></form>
                </section>

                <section id="module-analysis" class="rw-module-panel hidden" data-module="analysis">
                    <h3 class="rw-panel-title"><i class="fas fa-microscope rw-panel-icon" aria-hidden="true"></i>分析与建议</h3>
                    <div id="analysis-panel" class="rw-panel-body"></div>
                </section>

                <section id="module-recommendations" class="rw-module-panel hidden" data-module="recommendations">
                    <div class="rw-rec-header">
                        <div>
                            <h3 class="rw-panel-title"><i class="fas fa-box-open rw-panel-icon" aria-hidden="true"></i>商品推荐</h3>
                            <p class="rw-panel-hint">按菌门分析单元配置主推商品（0–1）与关联商品（0–3，有序）。选择商品仅修改会话，需单独保存后生效。</p>
                        </div>
                        <button type="button" id="btn-save-products" class="ant-btn ant-btn-primary ant-btn-sm hidden">保存商品配置</button>
                    </div>
                    <div id="recommendations-panel" class="rw-panel-body"></div>
                </section>

                <section id="module-checks" class="rw-module-panel hidden" data-module="checks">
                    <h3 class="rw-panel-title"><i class="fas fa-clipboard-check rw-panel-icon" aria-hidden="true"></i>发布检查</h3>
                    <p class="rw-panel-hint">阻断为 0 才允许提交审核 / 审核通过并发布。警告可确认后继续。</p>
                    <div id="checks-summary" class="rw-checks-summary"></div>
                    <div id="checks-panel" class="rw-panel-body"></div>
                </section>
            </div>
        </div>

        <div id="rw-preview-resizer" class="rw-preview-resizer" title="拖动调整预览宽度" role="separator" aria-orientation="vertical"></div>

        <aside id="rw-preview-pane" class="rw-preview-pane" aria-label="小程序报告预览">
            <div class="rw-preview-header">
                <span class="rw-preview-label"><i class="fas fa-mobile-screen" aria-hidden="true"></i>小程序报告预览</span>
                <div id="versions-toggle-wrap" class="hidden">
                    <div class="rw-version-toggle" role="group" aria-label="预览版本">
                        <button type="button" id="ver-toggle-working" class="rw-ver-toggle-btn active">工作版</button>
                        <button type="button" id="ver-toggle-published" class="rw-ver-toggle-btn">发布版</button>
                    </div>
                </div>
                <div class="rw-preview-header-actions">
                    <button type="button" id="btn-preview-collapse" class="rw-preview-icon-btn" title="收起预览" aria-label="收起预览">
                        <i class="fas fa-angles-right" aria-hidden="true"></i>
                    </button>
                    <button type="button" id="btn-preview-drawer-close" class="rw-preview-icon-btn rw-preview-drawer-only" title="关闭预览" aria-label="关闭预览">
                        <i class="fas fa-times" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div id="rw-preview-frame" class="rw-preview-frame">
                <div id="preview-content" class="rw-mini-app"></div>
            </div>
        </aside>
    </div>

    <button type="button" id="btn-preview-expand" class="rw-preview-expand hidden" title="展开预览" aria-label="展开预览">
        <i class="fas fa-mobile-screen" aria-hidden="true"></i> 本地预览
    </button>
    <button type="button" id="btn-preview-drawer-open" class="rw-preview-drawer-toggle" title="打开预览" aria-label="打开预览">
        <i class="fas fa-mobile-screen" aria-hidden="true"></i>
    </button>

    <div id="product-picker-modal" class="rw-modal hidden" role="dialog" aria-modal="true" aria-labelledby="picker-title">
        <div class="rw-product-picker-panel ant-modal-content">
            <div class="rw-modal-header">
                <h4 id="picker-title" class="rw-modal-title">选择商品</h4>
                <button type="button" id="picker-close" class="rw-modal-close" aria-label="关闭"><i class="fas fa-times" aria-hidden="true"></i></button>
            </div>
            <div class="rw-picker-filters">
                <input type="search" id="picker-search" class="ant-input" placeholder="名称或 SPU ID" aria-label="搜索商品">
                <select id="picker-category" class="ant-select" aria-label="商品分类"></select>
                <select id="picker-status" class="ant-select" aria-label="商品状态">
                    <option value="">全部状态</option>
                    <option value="on_sale">在售</option>
                    <option value="off_shelf">下架</option>
                    <option value="zero_stock">缺货</option>
                    <option value="recycled">回收</option>
                </select>
            </div>
            <div id="picker-list" class="rw-picker-list"></div>
            <div id="picker-pagination" class="rw-picker-pagination"></div>
        </div>
    </div>

    <div id="supplement-modal" class="rw-modal hidden" role="dialog" aria-modal="true" aria-label="补录检测结果">
        <div class="rw-modal-panel ant-modal-content">
            <div class="rw-modal-header">
                <h4 class="rw-modal-title">补录检测结果</h4>
                <button type="button" id="supplement-close" class="rw-modal-close" aria-label="关闭"><i class="fas fa-times" aria-hidden="true"></i></button>
            </div>
            <form id="supplement-form" class="rw-supplement-form">
                <div class="rw-form-field">
                    <label class="rw-field-label" for="supplement-key">分类单元</label>
                    <select id="supplement-key" class="ant-select" required></select>
                </div>
                <div class="rw-form-row">
                    <div class="rw-form-field">
                        <label class="rw-field-label" for="supplement-datastatus">数据状态</label>
                        <select id="supplement-datastatus" class="ant-select">
                            <option value="PRESENT">有效</option>
                            <option value="NOT_DETECTED">未检出</option>
                        </select>
                    </div>
                    <div class="rw-form-field">
                        <label class="rw-field-label" for="supplement-value">有效值</label>
                        <input id="supplement-value" type="number" step="any" class="ant-input">
                    </div>
                </div>
                <div class="rw-form-row">
                    <div class="rw-form-field">
                        <label class="rw-field-label" for="supplement-unit">单位</label>
                        <input id="supplement-unit" class="ant-input" value="%">
                    </div>
                    <div class="rw-form-field">
                        <label class="rw-field-label" for="supplement-labnotice">实验室标注</label>
                        <select id="supplement-labnotice" class="ant-select">
                            <option value="unmarked">未标注</option>
                            <option value="high">实验室标注偏高</option>
                            <option value="low">实验室标注偏低</option>
                        </select>
                    </div>
                </div>
                <div class="rw-form-field">
                    <label class="rw-field-label" for="supplement-reason">原因（必填）</label>
                    <textarea id="supplement-reason" rows="2" class="ant-input" required></textarea>
                </div>
                <div class="rw-modal-footer">
                    <button type="button" id="supplement-cancel" class="ant-btn ant-btn-default">取消</button>
                    <button type="submit" class="ant-btn ant-btn-primary">保存补录</button>
                </div>
            </form>
        </div>
    </div>
</div>
