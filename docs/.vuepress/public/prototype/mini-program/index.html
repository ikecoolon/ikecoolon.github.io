<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PET 小程序原型预览</title>
    <link rel="stylesheet" href="./css/gallery.css">
    <script>
        (function () {
            if (location.hash && location.hash.length > 1) {
                location.replace('./app.html' + location.hash);
            }
        })();
    </script>
</head>
<body class="gallery-body">
    <div class="gallery-page">
        <header class="gallery-header">
            <h1 class="gallery-title">PET 小程序原型预览</h1>
            <p class="gallery-meta">共 6 个页面</p>
            <p class="gallery-desc">页面可独立滚动与操作，点击名称可单独打开</p>
        </header>

        <section class="gallery-section" aria-labelledby="section-main">
            <h2 class="gallery-section-title" id="section-main">主要入口</h2>
            <div class="gallery-grid">
                <article class="preview-card">
                    <div class="preview-viewport">
                        <iframe src="./app.html#home" title="首页"></iframe>
                    </div>
                    <div class="preview-meta">
                        <a class="preview-name" href="./app.html#home" target="_blank" rel="noopener noreferrer">首页</a>
                        <a class="preview-open" href="./app.html#home" target="_blank" rel="noopener noreferrer">单独打开</a>
                    </div>
                </article>
                <article class="preview-card">
                    <div class="preview-viewport">
                        <iframe src="./app.html#pets" title="宠物列表"></iframe>
                    </div>
                    <div class="preview-meta">
                        <a class="preview-name" href="./app.html#pets" target="_blank" rel="noopener noreferrer">宠物列表</a>
                        <a class="preview-open" href="./app.html#pets" target="_blank" rel="noopener noreferrer">单独打开</a>
                    </div>
                </article>
                <article class="preview-card">
                    <div class="preview-viewport">
                        <iframe src="./app.html#profile" title="我的"></iframe>
                    </div>
                    <div class="preview-meta">
                        <a class="preview-name" href="./app.html#profile" target="_blank" rel="noopener noreferrer">我的</a>
                        <a class="preview-open" href="./app.html#profile" target="_blank" rel="noopener noreferrer">单独打开</a>
                    </div>
                </article>
            </div>
        </section>

        <section class="gallery-section" aria-labelledby="section-pets">
            <h2 class="gallery-section-title" id="section-pets">宠物详情</h2>
            <div class="gallery-grid">
                <article class="preview-card">
                    <div class="preview-viewport">
                        <iframe src="./app.html#pet-reports/pet-001" title="宠物详情"></iframe>
                    </div>
                    <div class="preview-meta">
                        <a class="preview-name" href="./app.html#pet-reports/pet-001" target="_blank" rel="noopener noreferrer">宠物详情（资料+报告）</a>
                        <a class="preview-open" href="./app.html#pet-reports/pet-001" target="_blank" rel="noopener noreferrer">单独打开</a>
                    </div>
                </article>
            </div>
        </section>

        <section class="gallery-section" aria-labelledby="section-reports">
            <h2 class="gallery-section-title" id="section-reports">报告阅读</h2>
            <div class="gallery-grid">
                <article class="preview-card">
                    <div class="preview-viewport">
                        <iframe src="./app.html#report/report-001" title="报告详情"></iframe>
                    </div>
                    <div class="preview-meta">
                        <a class="preview-name" href="./app.html#report/report-001" target="_blank" rel="noopener noreferrer">报告详情</a>
                        <a class="preview-open" href="./app.html#report/report-001" target="_blank" rel="noopener noreferrer">单独打开</a>
                    </div>
                </article>
            </div>
        </section>

        <section class="gallery-section" aria-labelledby="section-recs">
            <h2 class="gallery-section-title" id="section-recs">商品</h2>
            <div class="gallery-grid">
                <article class="preview-card">
                    <div class="preview-viewport">
                        <iframe src="./app.html#spu-detail/prod-001" title="商品详情"></iframe>
                    </div>
                    <div class="preview-meta">
                        <a class="preview-name" href="./app.html#spu-detail/prod-001" target="_blank" rel="noopener noreferrer">商品详情</a>
                        <a class="preview-open" href="./app.html#spu-detail/prod-001" target="_blank" rel="noopener noreferrer">单独打开</a>
                    </div>
                </article>
            </div>
        </section>
    </div>

    <script>
        (function () {
            var PREVIEW_W = 393;
            var PREVIEW_H = 852;

            function fitPreview(viewport) {
                var scale = Math.min(1, viewport.clientWidth / PREVIEW_W);
                viewport.style.height = (PREVIEW_H * scale) + 'px';
                var iframe = viewport.querySelector('iframe');
                if (iframe) {
                    iframe.style.transform = 'scale(' + scale + ')';
                }
            }

            function fitAll() {
                document.querySelectorAll('.preview-viewport').forEach(fitPreview);
            }

            if (typeof ResizeObserver !== 'undefined') {
                var observer = new ResizeObserver(function (entries) {
                    entries.forEach(function (entry) {
                        fitPreview(entry.target);
                    });
                });
                document.querySelectorAll('.preview-viewport').forEach(function (el) {
                    observer.observe(el);
                });
            }

            window.addEventListener('load', fitAll);
            window.addEventListener('resize', fitAll);
        })();
    </script>
</body>
</html>
