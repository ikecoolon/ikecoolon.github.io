<div id="microbiota-knowledge" class="page space-y-4">
    <div class="bg-white rounded-lg border border-slate-200 p-5">
        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
            <div class="min-w-0 flex-1">
                <h2 class="text-lg font-semibold text-slate-800 mb-1">
                    <i class="fas fa-book-open text-teal-600 mr-2"></i>菌群科普模板
                </h2>
                <p class="text-sm text-slate-600 leading-relaxed">
                    本页维护门/属节点的<strong>结构化科普字段</strong>；<strong>不新增、不删除</strong>分类。
                    参考范围请到「指标 / 参考范围」维护；结果解释与总体建议请到「分析规则 / 报告审核」维护。
                    门–属关系请到
                    <a href="#dictionary-management" data-page="dictionary-management" class="text-teal-700 hover:underline">字典管理 → 菌群分类树</a>。
                </p>
            </div>
            <div class="shrink-0 flex flex-col items-stretch sm:items-end gap-2">
                <button type="button" id="mk-btn-open-global" class="ant-btn ant-btn-default text-sm">
                    <i class="fas fa-sliders mr-1"></i>全局场景词设置
                </button>
                <p id="mk-global-summary" class="text-xs text-slate-500 text-left sm:text-right leading-relaxed max-w-xs" aria-live="polite"></p>
            </div>
        </div>
    </div>

    <div class="flex flex-col md:flex-row gap-4 items-start">
        <aside class="w-full md:w-[280px] md:max-w-[280px] shrink-0 bg-white rounded-lg border border-slate-200 p-4 md:sticky md:top-4">
            <label class="block text-xs font-medium text-slate-500 mb-1" for="mk-search">分类树</label>
            <div class="relative mb-3">
                <i class="fas fa-search absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
                <input type="search" id="mk-search" autocomplete="off"
                    class="w-full border border-slate-300 rounded-md py-1.5 pl-7 pr-2 text-sm"
                    placeholder="搜索门、属、学名或编码">
            </div>
            <div id="mk-tree" class="space-y-0.5 max-h-[60vh] overflow-y-auto text-sm"></div>
            <p class="mt-3 pt-3 border-t border-slate-100 text-xs text-slate-400 leading-relaxed">
                门–属关系在字典管理中维护；本页只编辑面向用户的科普模板。
            </p>
        </aside>

        <div class="flex-1 min-w-0 space-y-4">
            <div id="mk-editor" class="space-y-4">
                <section class="bg-white rounded-lg border border-slate-200 p-5">
                    <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
                        <div class="min-w-0">
                            <div class="flex items-center gap-2 flex-wrap">
                                <h3 id="mk-label" class="text-xl font-semibold text-slate-800">—</h3>
                                <span id="mk-level-badge" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-teal-50 text-teal-800">门</span>
                            </div>
                            <p id="mk-parent-line" class="hidden text-xs text-slate-500 mt-1"></p>
                        </div>
                        <button type="button" id="mk-btn-save" class="btn-primary px-4 py-2 rounded-md text-sm shrink-0">
                            <i class="fas fa-save mr-1"></i>保存当前节点
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                        <div>
                            <label class="text-xs text-slate-500" for="mk-latin-name">学名</label>
                            <input type="text" id="mk-latin-name"
                                class="block w-full border rounded-md py-1.5 px-2 mt-1 text-sm"
                                placeholder="如 Bacteroidetes">
                        </div>
                        <div>
                            <label class="text-xs text-slate-500" for="mk-key">编码 key</label>
                            <input type="text" id="mk-key" readonly
                                class="block w-full border rounded-md py-1.5 px-2 mt-1 text-sm bg-slate-50 text-slate-500 font-mono">
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div>
                            <label class="text-xs text-slate-500" for="mk-scene-copy" id="mk-scene-copy-label">场景句核心短语（可选）</label>
                            <input type="text" id="mk-scene-copy"
                                class="block w-full border rounded-md py-1.5 px-2 mt-1 text-sm"
                                placeholder="如「敏捷的采集者」—— 拼入用户端场景句，留空则不显示">
                        </div>

                        <div id="mk-phylum-fields" class="space-y-3">
                            <div>
                                <label class="text-xs text-slate-500" for="mk-intro-text">导语（「什么是」弹层）</label>
                                <textarea id="mk-intro-text" rows="3"
                                    class="block w-full border rounded-md py-1.5 px-2 mt-1 text-sm"
                                    placeholder="门级科普导语，留空则不显示"></textarea>
                            </div>
                            <fieldset class="border-0 p-0 m-0">
                                <legend class="text-xs text-slate-500 mb-1">主要工作</legend>
                                <p id="mk-main-tasks-empty" class="text-xs text-slate-400 mb-2 hidden">暂无主要工作条目</p>
                                <div id="mk-main-tasks-list" class="mk-main-tasks-list" role="list"></div>
                                <button type="button" id="mk-main-tasks-add" class="ant-btn ant-btn-default ant-btn-sm mt-2">
                                    <i class="fas fa-plus"></i> 添加一条
                                </button>
                            </fieldset>
                        </div>

                        <div id="mk-genus-fields" class="space-y-3 hidden">
                            <div>
                                <label class="text-xs text-slate-500" for="mk-appearance-text">外观描述</label>
                                <textarea id="mk-appearance-text" rows="2"
                                    class="block w-full border rounded-md py-1.5 px-2 mt-1 text-sm"
                                    placeholder="属级外观说明，留空则不显示"></textarea>
                            </div>
                            <div>
                                <label class="text-xs text-slate-500" for="mk-function-text">主要功能</label>
                                <textarea id="mk-function-text" rows="3"
                                    class="block w-full border rounded-md py-1.5 px-2 mt-1 text-sm"
                                    placeholder="属级功能说明，留空则不显示"></textarea>
                            </div>
                        </div>

                        <div>
                            <label class="text-xs text-slate-500" for="mk-hint">提示条（不随状态变化）</label>
                            <textarea id="mk-hint" rows="2"
                                class="block w-full border rounded-md py-1.5 px-2 mt-1 text-sm"
                                placeholder="用户端弹窗固定展示，不随偏低 / 正常 / 偏高切换"></textarea>
                        </div>
                    </div>
                </section>

                <section class="bg-white rounded-lg border border-dashed border-slate-300 p-5">
                    <div class="flex items-center justify-between gap-2 mb-3">
                        <h4 class="text-sm font-medium text-slate-700">
                            <i class="fas fa-mobile-screen-button text-slate-400 mr-1"></i>用户端预览
                        </h4>
                    </div>
                    <div id="mk-preview" class="text-sm text-slate-700 space-y-3"></div>
                </section>
            </div>
        </div>
    </div>

    <div id="mk-drawer-root" class="ant-drawer-root" hidden aria-hidden="true">
        <div class="ant-drawer-mask" data-mk-drawer-close tabindex="-1"></div>
        <div class="ant-drawer-wrap">
            <div class="ant-drawer" role="dialog" aria-modal="true" aria-labelledby="mk-drawer-title" tabindex="-1">
                <div class="ant-drawer-header">
                    <h3 id="mk-drawer-title" class="ant-drawer-title">全局场景词设置</h3>
                    <button type="button" class="ant-drawer-close" data-mk-drawer-close aria-label="关闭">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="ant-drawer-body">
                    <p class="text-xs text-slate-500 leading-relaxed mb-4">
                        依据<strong>有效参考范围</strong>判定偏低 / 正常 / 偏高后，拼入用户端场景句尾部；所有门、属共用。留空则对应状态不追加文案。
                    </p>
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs text-slate-500" for="mk-pres-low">偏低（low）</label>
                            <input type="text" id="mk-pres-low"
                                class="block w-full border rounded-md py-1.5 px-2 mt-1 text-sm"
                                placeholder="如「略显稀疏」">
                        </div>
                        <div>
                            <label class="text-xs text-slate-500" for="mk-pres-normal">正常（normal）</label>
                            <input type="text" id="mk-pres-normal"
                                class="block w-full border rounded-md py-1.5 px-2 mt-1 text-sm"
                                placeholder="如「生机适宜」">
                        </div>
                        <div>
                            <label class="text-xs text-slate-500" for="mk-pres-high">偏高（high）</label>
                            <input type="text" id="mk-pres-high"
                                class="block w-full border rounded-md py-1.5 px-2 mt-1 text-sm"
                                placeholder="如「略显繁茂」">
                        </div>
                    </div>
                </div>
                <div class="ant-drawer-footer">
                    <button type="button" class="ant-btn ant-btn-default" data-mk-drawer-close>取消</button>
                    <button type="button" id="mk-btn-save-global" class="ant-btn ant-btn-primary">保存全局设置</button>
                </div>
            </div>
        </div>
    </div>
</div>
